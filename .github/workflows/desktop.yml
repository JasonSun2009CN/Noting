name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            platform: mac
            arch: arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows
            os: windows-latest
            platform: win
            arch: x64
          - name: Linux
            os: ubuntu-latest
            platform: linux
            arch: x64
    env:
      # Avoid enabling a signing path when no certificate is configured.
      SIGN_CERT: ${{ secrets.CSC_LINK }}
      SIGN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure code signing
        shell: bash
        run: |
          if [ -n "$SIGN_CERT" ]; then
            {
              echo "CSC_LINK=$SIGN_CERT"
              echo "CSC_KEY_PASSWORD=$SIGN_PASSWORD"
              if [ -n "$NOTARY_APPLE_ID" ]; then
                echo "APPLE_ID=$NOTARY_APPLE_ID"
                echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD"
                echo "APPLE_TEAM_ID=$NOTARY_TEAM"
              fi
            } >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: noting-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
