appId: com.noting.desktop
productName: Noting
copyright: Copyright © 2026 Noting contributors

# build/icon.icns, icon.ico and icon.png are derived from web/public/favicon.svg.

directories:
  output: release
  buildResources: build

# Keep the bundle small: the React build is shipped as an extra resource and the
# Electron main process imports the same server/ code as the Docker image.
files:
  - desktop/**/*
  - server/**/*
  - package.json
  - LICENSE

extraResources:
  - from: dist
    to: dist

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
# better-sqlite3 13 uses N-API, so its prebuilt binary works in Electron as-is.
npmRebuild: false

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  category: Office
  icon: build/icon.png
  maintainer: Noting contributors <noting@users.noreply.github.com>
  synopsis: Private, self-hosted workspace with a block editor
  target:
    - AppImage
    - deb
